name: 쇼츠 자동 생성

# posts.json 이 바뀌면(새 블로그 글) 아직 영상이 없는 글을 음성 내레이션 쇼츠로 만들어 videos/ 에 올립니다.
# Actions 탭에서 수동 실행하면 특정 글·목소리로 다시 만들 수 있습니다.
on:
  push:
    branches: [main]
    paths: [posts.json]
  workflow_dispatch:
    inputs:
      only:
        description: "다시 만들 글 (posts.json 순번, 0이 최신, 쉼표로 여러 개). 비우면 새 글만"
        required: false
        default: ""
      voice:
        description: "목소리"
        type: choice
        options: [ko-KR-SunHiNeural, ko-KR-InJoonNeural, ko-KR-HyunsuMultilingualNeural]
        default: ko-KR-SunHiNeural
      theme:
        description: "스타일"
        type: choice
        options: [pop, news, pastel]
        default: pop

permissions:
  contents: write

concurrency:
  group: shorts
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 도구 설치
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-noto-cjk
          pip install -q edge-tts playwright
          python -m playwright install --with-deps chromium
      - name: 영상 만들기
        env:
          ONLY: ${{ inputs.only }}
          VOICE: ${{ inputs.voice || 'ko-KR-SunHiNeural' }}
          THEME: ${{ inputs.theme || 'pop' }}
        run: |
          if [ -n "$ONLY" ]; then SEL=(--only "$ONLY"); else SEL=(--new --limit 10); fi
          python tools/make_video.py "${SEL[@]}" --voice "$VOICE" --theme "$THEME"
      - name: 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "쇼츠 영상 자동 생성"
          git pull --rebase -q origin main
          git push
